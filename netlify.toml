[build]
  publish = "public"

# Proxy API calls directly to the live Cloudflare Worker API connected to MongoDB Atlas
[[redirects]]
  from = "/api/*"
  to = "https://journeyhub.dhanushbs0425.workers.dev/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache-control headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
