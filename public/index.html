<!DOCTYPE html>
<html lang="en" data-theme="navy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JourneyHub — Collaborative Travel Planning & Budget Management</title>
  <meta name="description" content="Collaborative travel planning and budget management platform with interval conflict detection, greedy debt settlement, and trip readiness checklists." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css?v=2.8" />
  <link rel="stylesheet" href="/css/layout.css?v=2.8" />
  <link rel="stylesheet" href="/css/components.css?v=2.8" />
  <link rel="stylesheet" href="/css/pages.css?v=2.8" />
</head>
<body>

  <!-- Instant Branded Boot Preloader (disappears within 250ms on client mount) -->
  <div id="jh-boot-preloader">
    <div class="jh-preloader-card">
      <div class="jh-brand-logo">
        <i class="fas fa-plane-departure"></i>
      </div>
      <h2 class="jh-brand-title">JourneyHub</h2>
      <p class="jh-brand-tagline">Collaborative Travel Intelligence Platform</p>
      <div class="jh-preloader-bar">
        <div class="jh-preloader-progress"></div>
      </div>
      <p class="jh-preloader-status" id="jh-preloader-status">Initializing travel workspace...</p>
    </div>
  </div>
  <script>
    // Failsafe: Automatically remove boot preloader after 1.5s on mobile/slow connections
    setTimeout(function() {
      var p = document.getElementById('jh-boot-preloader');
      if (p) {
        p.classList.add('fade-out');
        setTimeout(function() {
          if (p && p.parentNode) p.parentNode.removeChild(p);
        }, 400);
      }
    }, 1500);
  </script>

  <!-- App Main Shell -->
  <div id="app-shell">
    <!-- Backdrop for mobile drawer -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Collapsible Sidebar -->
    <aside id="app-sidebar"></aside>

    <!-- Content Workspace -->
    <main id="app-main">
      <!-- Topbar -->
      <header id="app-topbar"></header>

      <!-- Viewport Router Container -->
      <div id="app-viewport">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <!-- Accessible Modals Host -->
  <div id="modal-container"></div>

  <!-- Toast Notification Host -->
  <div id="toast-container"></div>

  <!-- External Libraries -->
  <!-- Chart.js for reports -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Leaflet for maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Socket.IO Client (CDN for universal static & backend compatibility) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Core Scripts -->
  <script src="/js/api.js?v=3.2"></script>
  <script src="/js/state.js?v=3.2"></script>
  <script src="/js/utils/destinationImages.js?v=3.4"></script>
  <script src="/js/components/backendStatus.js?v=3.2"></script>
  <script src="/js/components/toast.js?v=3.2"></script>
  <script src="/js/components/modal.js?v=3.2"></script>
  <script src="/js/components/navbar.js?v=3.2"></script>
  <script src="/js/components/sidebar.js?v=3.2"></script>

  <!-- Page View Controllers -->
  <script src="/js/pages/landingPage.js?v=3.4"></script>
  <script src="/js/pages/registerPage.js?v=3.4"></script>
  <script src="/js/pages/loginPage.js?v=3.4"></script>
  <script src="/js/pages/verifyOtpPage.js?v=3.2"></script>
  <script src="/js/pages/profileSetupPage.js?v=3.2"></script>
  <script src="/js/pages/forgotPasswordPage.js?v=3.2"></script>
  <script src="/js/pages/resetPasswordPage.js?v=3.2"></script>
  <script src="/js/pages/profilePage.js?v=3.5"></script>
  <script src="/js/pages/dashboardPage.js?v=3.9"></script>
  <script src="/js/pages/createTripPage.js?v=3.5"></script>
  <script src="/js/pages/tripDetailsPage.js?v=3.9"></script>
  <script src="/js/pages/destinationExplorerPage.js?v=3.2"></script>
  <script src="/js/pages/itineraryPage.js?v=3.2"></script>
  <script src="/js/pages/collaborationPage.js?v=3.2"></script>
  <script src="/js/pages/expenseTrackerPage.js?v=3.2"></script>
  <script src="/js/pages/expenseSettlementPage.js?v=3.2"></script>
  <script src="/js/pages/packingPage.js?v=3.2"></script>
  <script src="/js/pages/bookingPage.js?v=3.2"></script>
  <script src="/js/pages/diaryPage.js?v=3.2"></script>
  <script src="/js/pages/notificationsPage.js?v=3.2"></script>
  <script src="/js/pages/reportsPage.js?v=3.2"></script>
  <script src="/js/pages/settingsPage.js?v=3.2"></script>

  <!-- Role-Based & Distinctive Features Controllers -->
  <script src="/js/pages/exploreTripsPage.js?v=3.9"></script>
  <script src="/js/pages/myRequestsPage.js?v=3.2"></script>
  <script src="/js/pages/organiserRequestsPage.js?v=3.2"></script>
  <script src="/js/pages/organiserTripsPage.js?v=3.2"></script>
  <script src="/js/pages/mysteryTripsPage.js?v=3.2"></script>
  <script src="/js/pages/wishlistPage.js?v=3.9"></script>

  <!-- Router & Application Initialization -->
  <script src="/js/router.js?v=3.9"></script>
  <script src="/js/app.js?v=3.9"></script>
</body>
</html>
